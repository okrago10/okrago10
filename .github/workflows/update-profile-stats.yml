name: Update profile stats

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 UTC 0:00 (JST 9:00)
  workflow_dispatch:
  # 生成側を変えたら次の定時実行を待たずにカードを作り直す。カード自体の
  # コミットでは発火しないので、この push が自分を呼び戻すことはない。
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1 # 2026-07-20 リリース

      - uses: actions/setup-node@v7.0.0 # 2026-07-14 リリース
        with:
          # 最新の 26.7.0 はリリースから7日未満のため、26.6.0 (2026-08-03) に固定
          node-version: "26.6.0"

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
          OUT_PATH: assets/stats.svg
        run: node scripts/generate-stats.mjs

      - name: Generate activity card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
          OUT_PATH: assets/activity.svg
        run: node scripts/generate-activity.mjs

      # 片方のカードの生成が失敗しても、もう片方の結果は捨てずにコミットする。
      - name: Commit if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/activity.svg
          if git diff --staged --quiet; then
            echo "cards unchanged"
            exit 0
          fi
          git commit -m "chore: update profile cards"
          # 実行中にブランチが動いていると push が弾かれるので、取り込んでから送る。
          branch="$(git branch --show-current)"
          git pull --rebase origin "$branch"
          git push origin "$branch"
