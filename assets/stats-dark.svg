<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" class="gh-stats" fill="#e6edf3" role="img" aria-label="GitHub stats for okrago10">
    <style>
      .gh-stats .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #58a6ff; }
      .gh-stats .label { font: 400 14px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
      .gh-stats .value { font: 600 14px 'Segoe UI', Ubuntu, sans-serif; fill: #e6edf3; }
      .gh-stats .section { font: 600 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
      .gh-stats .legend { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #e6edf3; }

      .gh-stats .frame { animation: gh-st-draw 0.7s ease-out both; }
      .gh-stats .title { animation: gh-st-fadeUp 0.4s cubic-bezier(.2,.7,.3,1) both 0.15s; }
      .gh-stats .row { animation: gh-st-rowIn 0.35s cubic-bezier(.2,.7,.3,1) both var(--d, 0s); }
      .gh-stats .section, .gh-stats .track { animation: gh-st-fadeUp 0.4s cubic-bezier(.2,.7,.3,1) both 0.58s; }
      .gh-stats .reveal {
        transform-box: view-box;
        transform-origin: 24px 216px;
        animation: gh-st-grow 0.55s cubic-bezier(.2,.7,.3,1) both 0.73s;
      }
      .gh-stats .legend-item { animation: gh-st-fadeUp 0.35s cubic-bezier(.2,.7,.3,1) both var(--d, 0s); }

      /* 途中値は opacity 属性で伏せてあり、自分の区間だけ show で見せる。
         最終値は最初から見えていて、出番が来るまでを hide で伏せる。どちらも
         fill-mode を既定の none のままにするのが前提で、both を足すと最終値が
         消えたまま固定される。スタイルが効かない環境では属性の値がそのまま
         残るので、最終値だけが見える。 */
      .gh-stats .tick {
        animation-name: gh-st-show;
        animation-timing-function: linear;
        animation-duration: var(--dur, 0s);
        animation-delay: var(--dly, 0s);
      }
      .gh-stats .tick-last { animation-name: gh-st-hide; }

      @keyframes gh-st-draw {
      from { stroke-dasharray: 1316; stroke-dashoffset: 1316; }
      to { stroke-dasharray: 1316; stroke-dashoffset: 0; }
    }
    @keyframes gh-st-fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
      @keyframes gh-st-rowIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes gh-st-grow {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes gh-st-show { from, to { opacity: 1; } }
      @keyframes gh-st-hide { from, to { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
      .gh-stats * { animation: none !important; }
    }
    </style>
    <rect class="frame" x="0.5" y="0.5" width="419" height="249" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="24" y="42" class="title">okura&#39;s GitHub Stats</text>
    <g class="row" style="--d:0.3s"><text x="24" y="76" class="label">Total Stars</text><text x="396" y="76" text-anchor="end" class="value tick tick-last" style="--dur:0.4s;--dly:0s">0</text></g>
  <g class="row" style="--d:0.37s"><text x="24" y="102" class="label">Commits (past year)</text><text x="396" y="102" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.47s" opacity="0" aria-hidden="true">0</text><text x="396" y="102" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.57s" opacity="0" aria-hidden="true">86</text><text x="396" y="102" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.67s" opacity="0" aria-hidden="true">152</text><text x="396" y="102" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.77s" opacity="0" aria-hidden="true">198</text><text x="396" y="102" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.87s" opacity="0" aria-hidden="true">228</text><text x="396" y="102" text-anchor="end" class="value tick tick-last" style="--dur:0.97s;--dly:0s">245</text></g>
  <g class="row" style="--d:0.44s"><text x="24" y="128" class="label">Pull Requests</text><text x="396" y="128" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.54s" opacity="0" aria-hidden="true">0</text><text x="396" y="128" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.64s" opacity="0" aria-hidden="true">39</text><text x="396" y="128" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.74s" opacity="0" aria-hidden="true">68</text><text x="396" y="128" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.84s" opacity="0" aria-hidden="true">89</text><text x="396" y="128" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.94s" opacity="0" aria-hidden="true">102</text><text x="396" y="128" text-anchor="end" class="value tick tick-last" style="--dur:1.04s;--dly:0s">110</text></g>
  <g class="row" style="--d:0.51s"><text x="24" y="154" class="label">Issues</text><text x="396" y="154" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.61s" opacity="0" aria-hidden="true">0</text><text x="396" y="154" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.71s" opacity="0" aria-hidden="true">24</text><text x="396" y="154" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.81s" opacity="0" aria-hidden="true">42</text><text x="396" y="154" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:0.91s" opacity="0" aria-hidden="true">55</text><text x="396" y="154" text-anchor="end" class="value tick" style="--dur:0.1s;--dly:1.01s" opacity="0" aria-hidden="true">63</text><text x="396" y="154" text-anchor="end" class="value tick tick-last" style="--dur:1.11s;--dly:0s">68</text></g>
  <g class="row" style="--d:0.58s"><text x="24" y="180" class="label">Followers</text><text x="396" y="180" text-anchor="end" class="value tick tick-last" style="--dur:0.68s;--dly:0s">0</text></g>
    <text x="24" y="202" class="section">Top Languages</text>
    <clipPath id="gh-stats-bar"><rect x="24" y="212" width="372" height="8" rx="4"/></clipPath>
    <clipPath id="gh-stats-reveal"><rect class="reveal" x="24" y="212" width="372" height="8"/></clipPath>
    <rect class="track" x="24" y="212" width="372" height="8" rx="4" fill="#21262d"/>
    <g clip-path="url(#gh-stats-bar)"><g clip-path="url(#gh-stats-reveal)"><rect x="24" y="212" width="266" height="8" fill="#3178c6"/><rect x="290" y="212" width="53" height="8" fill="#f1e05a"/><rect x="343" y="212" width="53" height="8" fill="#dea584"/></g></g>
    <g class="legend-item" style="--d:1.28s"><circle cx="29" cy="232" r="5" fill="#3178c6"/><text x="40" y="236" class="legend">TypeScript 71%</text></g><g class="legend-item" style="--d:1.36s"><circle cx="157" cy="232" r="5" fill="#f1e05a"/><text x="168" y="236" class="legend">JavaScript 14%</text></g><g class="legend-item" style="--d:1.44s"><circle cx="285" cy="232" r="5" fill="#dea584"/><text x="296" y="236" class="legend">Rust 14%</text></g>
  </svg>
  