<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" role="img" aria-label="GitHub stats for okrago10">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #0969da; }
    .label { font: 400 14px 'Segoe UI', Ubuntu, sans-serif; fill: #57606a; }
    .value { font: 600 14px 'Segoe UI', Ubuntu, sans-serif; fill: #24292f; }
    .section { font: 600 12px 'Segoe UI', Ubuntu, sans-serif; fill: #57606a; }
    .legend { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #24292f; }

    .frame { animation: draw 1.1s ease-out both; }
    .title { animation: fadeUp .5s cubic-bezier(.2,.7,.3,1) both .25s; }
    .row { animation: rowIn .45s cubic-bezier(.2,.7,.3,1) both var(--d); }
    .section { animation: fadeUp .5s cubic-bezier(.2,.7,.3,1) both 1s; }
    .reveal { transform-origin: 24px 216px; animation: grow .8s cubic-bezier(.2,.7,.3,1) both 1.1s; }
    .legend-item { animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both var(--d); }

    .tick {
      opacity: 0;
      animation-duration: .66s;
      animation-timing-function: linear;
      animation-fill-mode: both;
      animation-delay: calc(var(--d) + .12s);
    }
    .t0 { animation-name: tk0; }
    .t1 { animation-name: tk1; }
    .t2 { animation-name: tk2; }
    .t3 { animation-name: tk3; }
    .t4 { animation-name: tk4; }
    .t5 { opacity: 1; animation-name: tk5; }

    @keyframes draw {
      from { stroke-dasharray: 1320; stroke-dashoffset: 1320; }
      to { stroke-dasharray: 1320; stroke-dashoffset: 0; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes grow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes tk0 { 0%, 16.6% { opacity: 1; } 16.7%, 100% { opacity: 0; } }
    @keyframes tk1 { 0%, 16.6% { opacity: 0; } 16.7%, 33.2% { opacity: 1; } 33.3%, 100% { opacity: 0; } }
    @keyframes tk2 { 0%, 33.2% { opacity: 0; } 33.3%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes tk3 { 0%, 49.9% { opacity: 0; } 50%, 66.5% { opacity: 1; } 66.6%, 100% { opacity: 0; } }
    @keyframes tk4 { 0%, 66.5% { opacity: 0; } 66.6%, 83.2% { opacity: 1; } 83.3%, 100% { opacity: 0; } }
    @keyframes tk5 { 0%, 83.2% { opacity: 0; } 83.3%, 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .frame, .title, .row, .section, .reveal, .legend-item, .tick { animation: none; }
    }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="419" height="249" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="42" class="title">okura&#39;s GitHub Stats</text>
  <g class="row" style="--d:0.45s"><text x="24" y="76" class="label">Total Stars</text><text x="396" y="76" text-anchor="end" class="value tick t0" aria-hidden="true">0</text><text x="396" y="76" text-anchor="end" class="value tick t1" aria-hidden="true">0</text><text x="396" y="76" text-anchor="end" class="value tick t2" aria-hidden="true">0</text><text x="396" y="76" text-anchor="end" class="value tick t3" aria-hidden="true">0</text><text x="396" y="76" text-anchor="end" class="value tick t4" aria-hidden="true">0</text><text x="396" y="76" text-anchor="end" class="value tick t5">0</text></g>
  <g class="row" style="--d:0.55s"><text x="24" y="102" class="label">Commits (past year)</text><text x="396" y="102" text-anchor="end" class="value tick t0" aria-hidden="true">0</text><text x="396" y="102" text-anchor="end" class="value tick t1" aria-hidden="true">82</text><text x="396" y="102" text-anchor="end" class="value tick t2" aria-hidden="true">146</text><text x="396" y="102" text-anchor="end" class="value tick t3" aria-hidden="true">190</text><text x="396" y="102" text-anchor="end" class="value tick t4" aria-hidden="true">219</text><text x="396" y="102" text-anchor="end" class="value tick t5">235</text></g>
  <g class="row" style="--d:0.65s"><text x="24" y="128" class="label">Pull Requests</text><text x="396" y="128" text-anchor="end" class="value tick t0" aria-hidden="true">0</text><text x="396" y="128" text-anchor="end" class="value tick t1" aria-hidden="true">37</text><text x="396" y="128" text-anchor="end" class="value tick t2" aria-hidden="true">65</text><text x="396" y="128" text-anchor="end" class="value tick t3" aria-hidden="true">85</text><text x="396" y="128" text-anchor="end" class="value tick t4" aria-hidden="true">98</text><text x="396" y="128" text-anchor="end" class="value tick t5">105</text></g>
  <g class="row" style="--d:0.75s"><text x="24" y="154" class="label">Issues</text><text x="396" y="154" text-anchor="end" class="value tick t0" aria-hidden="true">0</text><text x="396" y="154" text-anchor="end" class="value tick t1" aria-hidden="true">23</text><text x="396" y="154" text-anchor="end" class="value tick t2" aria-hidden="true">42</text><text x="396" y="154" text-anchor="end" class="value tick t3" aria-hidden="true">54</text><text x="396" y="154" text-anchor="end" class="value tick t4" aria-hidden="true">62</text><text x="396" y="154" text-anchor="end" class="value tick t5">67</text></g>
  <g class="row" style="--d:0.85s"><text x="24" y="180" class="label">Followers</text><text x="396" y="180" text-anchor="end" class="value tick t0" aria-hidden="true">0</text><text x="396" y="180" text-anchor="end" class="value tick t1" aria-hidden="true">0</text><text x="396" y="180" text-anchor="end" class="value tick t2" aria-hidden="true">0</text><text x="396" y="180" text-anchor="end" class="value tick t3" aria-hidden="true">0</text><text x="396" y="180" text-anchor="end" class="value tick t4" aria-hidden="true">0</text><text x="396" y="180" text-anchor="end" class="value tick t5">0</text></g>
  <text x="24" y="202" class="section">Top Languages</text>
  <clipPath id="bar"><rect x="24" y="212" width="372" height="8" rx="4"/></clipPath>
  <clipPath id="reveal"><rect class="reveal" x="24" y="212" width="372" height="8"/></clipPath>
  <rect x="24" y="212" width="372" height="8" rx="4" fill="#eaeef2"/>
  <g clip-path="url(#bar)"><g clip-path="url(#reveal)"><rect x="24" y="212" width="266" height="8" fill="#3178c6"/><rect x="290" y="212" width="53" height="8" fill="#f1e05a"/><rect x="343" y="212" width="53" height="8" fill="#dea584"/></g></g>
  <g class="legend-item" style="--d:1.60s"><circle cx="29" cy="232" r="5" fill="#3178c6"/><text x="40" y="236" class="legend">TypeScript 71%</text></g><g class="legend-item" style="--d:1.72s"><circle cx="157" cy="232" r="5" fill="#f1e05a"/><text x="168" y="236" class="legend">JavaScript 14%</text></g><g class="legend-item" style="--d:1.84s"><circle cx="285" cy="232" r="5" fill="#dea584"/><text x="296" y="236" class="legend">Rust 14%</text></g>
</svg>
