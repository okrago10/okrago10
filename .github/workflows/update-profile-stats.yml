name: Update profile stats

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 UTC 0:00 (JST 9:00)
  workflow_dispatch:
  # 生成側を変えたら次の定時実行を待たずにカードを作り直す。カード自体の
  # コミットでは発火しないので、この push が自分を呼び戻すことはない。
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1 # 2026-07-20 リリース

      - uses: actions/setup-node@v7.0.0 # 2026-07-14 リリース
        with:
          # 最新の 26.7.0 はリリースから7日未満のため、26.6.0 (2026-08-03) に固定
          node-version: "26.6.0"

      # 生成側がライトとダークを 1 枚ずつ書き出す。README の picture 要素が
      # GitHub のテーマ設定に合わせて出し分ける。
      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
          OUT_PATH: assets/stats.svg
        run: node scripts/generate-stats.mjs

      # stats 側が落ちても activity は作り直す (逆向きは commit 側で吸収する)。
      - name: Generate activity cards
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
          OUT_PATH: assets/activity.svg
        run: node scripts/generate-activity.mjs

      # 片方のカードの生成が失敗しても、もう片方の結果は捨てずにコミットする。
      - name: Commit if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$(git branch --show-current)"
          git fetch origin "$branch"
          # 実行中にブランチが動いていると push が弾かれる。カードは毎回すべて
          # 書き換わるので rebase では必ず衝突する。生成結果を取り置いてから
          # リモートの先端に載せ直せば、浅いクローンのままでも衝突しない。
          cards="assets/stats.svg assets/stats-dark.svg \
            assets/activity.svg assets/activity-dark.svg"
          staging="$(mktemp -d)"
          cp $cards "$staging/"
          git reset --hard "origin/$branch"
          cp "$staging"/*.svg assets/
          git add $cards
          if git diff --staged --quiet; then
            echo "cards unchanged"
            exit 0
          fi
          git commit -m "chore: update profile cards"
          git push origin "$branch"
